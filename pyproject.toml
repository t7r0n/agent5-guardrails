[project]
name = "agent5-guardrails"
version = "0.1.0"
description = "A live evaluation + policy conformance harness that turns Open's webhook stream into an auditable \"Agent 5 didn't break the rules this week\""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tarun Aditya Kusupati" }
]
dependencies = []

[project.scripts]
agent5-guardrails = "agent5_guardrails.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
